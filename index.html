<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pump Room — pumproom.democrat</title>
  <meta
    name="description"
    content="Welcome to The Pump Room (pumproom.democrat) — apps, media projects, and experiments off the workbench."
  />
  <meta property="og:title" content="The Pump Room — pumproom.democrat" />
  <meta
    property="og:description"
    content="Things I’m building, testing, and sharing — apps, media, and experiments off the workbench."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pumproom.democrat" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=JetBrains+Mono:wght@500&family=Tilt+Neon&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./neon.css" />
</head>
<body>
  <main
    class="neon-hero"
    id="neon-hero"
    data-power="off"
    data-the="off"
    data-pump="off"
    data-room="off"
  >
    <h1 class="sr-only">The Pump Room</h1>

    <div class="sign-stage">
      <div class="neon-lockup" aria-hidden="true">
        <div class="lockup-core">
          <span class="neon-word word-the">THE</span>

          <svg
            class="word-pump-svg"
            viewBox="0 0 680 210"
            role="presentation"
            focusable="false"
            overflow="visible"
          >
            <defs>
              <!-- Soft pillowy interior fill when PUMP is lit -->
              <linearGradient id="pump-lit-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="52%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#eef5ff" />
              </linearGradient>

              <!-- Unlit dark-glass interior gradient -->
              <linearGradient id="pump-unlit-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#1e1e24" />
                <stop offset="48%" stop-color="#16161a" />
                <stop offset="100%" stop-color="#111115" />
              </linearGradient>

              <!-- Multi-stage optical bloom for bright white halo around black PUMP letters -->
              <filter
                id="pump-bloom"
                x="-60%"
                y="-95%"
                width="220%"
                height="290%"
                color-interpolation-filters="sRGB"
              >
                <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur-tight" />
                <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur-mid" />
                <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur-wide" />
                <feGaussianBlur in="SourceGraphic" stdDeviation="48" result="blur-halo" />
                <feComponentTransfer in="blur-halo" result="blur-halo-soft">
                  <feFuncA type="linear" slope="0.6" />
                </feComponentTransfer>
                <feMerge>
                  <feMergeNode in="blur-halo-soft" />
                  <feMergeNode in="blur-wide" />
                  <feMergeNode in="blur-mid" />
                  <feMergeNode in="blur-mid" />
                  <feMergeNode in="blur-tight" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <!-- Glowing pillowy bloom pass (visible when PUMP is powered on) -->
            <text
              class="pump-text pump-bloom-layer"
              x="340"
              y="174"
              text-anchor="middle"
              filter="url(#pump-bloom)"
            >PUMP</text>

            <!-- Solid rounded body layer (dark-glass unlit -> blinding white inflated lit) -->
            <text
              class="pump-text pump-body-layer"
              x="340"
              y="174"
              text-anchor="middle"
            >PUMP</text>
          </svg>

          <span class="neon-word word-room">RO<span class="room-o2">O</span>M</span>
        </div>
      </div>
    </div>

    <div class="hero-controls">
      <a href="./studio.html" class="enter-link" id="enter-link">
        <span>ENTER</span>
        <span class="enter-arrow" aria-hidden="true">→</span>
      </a>

      <button
        type="button"
        class="power-switch"
        id="power-switch"
        role="switch"
        aria-checked="false"
        aria-label="Toggle neon sign power"
      >
        <span class="switch-housing" aria-hidden="true">
          <span class="switch-led"></span>
          <span class="switch-slot">
            <span class="switch-lever"></span>
          </span>
        </span>
        <span class="switch-caption" id="switch-caption">OFF</span>
      </button>
    </div>
  </main>

  <script src="./neon.js" defer></script>
</body>
</html>
